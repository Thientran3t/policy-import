spring:
  application:
    name: policy-import-poc

  datasource:
    url: jdbc:postgresql://localhost:5432/policy_import
    username: policy
    password: policy
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: when_authorized

    metrics:
      tags:
        application: policy-import


logging:
  level:
    root: INFO
    com.interview.policyimport: INFO
    com.interview.policyimport.repository: WARN
    org.hibernate.SQL: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

policy-import:
  partners:
    ACME:
      format: CSV
      delimiter: ","
      has-header: true
      columns:
        imei: IMEI
        plan-code: Plan
        effective-date: Effective Date
        expiry-date: Expiry Date
        premium: Premium
        currency: Currency

    TELCO:
      format: CSV
      delimiter: "|"
      has-header: true
      columns:
        imei: device_imei
        plan-code: product_code
        effective-date: start_date
        expiry-date: end_date
        premium: amount
        currency: ccy
  worker:
    concurrency: 4
    batch-size: 200
    lease-seconds: 300
    max-attempts: 3

  sftp:
    enabled: true
    polling-interval-ms: 60000
    partners:
      ACME:
        host: localhost
        port: 2222
        username: partner
        password: ${SFTP_PASSWORD:partner123}
        remote-directory: /upload/ACME
        strict-host-key-checking: false

      TELCO:
        host: localhost
        port: 2222
        username: partner
        password: ${SFTP_PASSWORD:partner123}
        remote-directory: /upload/TELCO
        strict-host-key-checking: false
  recovery:
    enabled: false